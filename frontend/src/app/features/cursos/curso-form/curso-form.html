<section class="curso-form">
  <header class="curso-form__header">
    <h1>{{ isEdit() ? 'Editar curso' : 'Novo curso' }}</h1>
    <a routerLink="/cursos" class="curso-form__voltar">Voltar</a>
  </header>

  @if (loading()) {
    <app-loading />
  } @else {
    <form class="curso-form__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="curso-form__field">
        <label for="codCurso">Código</label>
        <input id="codCurso" type="text" formControlName="codCurso" autocomplete="off" />
        @if (fieldError('codCurso'); as error) {
          <span class="curso-form__error">{{ error }}</span>
        }
      </div>

      <div class="curso-form__field">
        <label for="nome">Nome</label>
        <input id="nome" type="text" formControlName="nome" autocomplete="off" />
        @if (fieldError('nome'); as error) {
          <span class="curso-form__error">{{ error }}</span>
        }
      </div>

      <div class="curso-form__field">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" formControlName="descricao" rows="3"></textarea>
        @if (fieldError('descricao'); as error) {
          <span class="curso-form__error">{{ error }}</span>
        }
      </div>

      <div class="curso-form__actions">
        <a routerLink="/cursos" class="curso-form__cancelar">Cancelar</a>
        <button type="submit" class="curso-form__salvar" [disabled]="saving()">
          {{ saving() ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  }
</section>
